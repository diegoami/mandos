name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: upstream
            ref: 45dee074117d8b4ef49b4b28cd26f118b167ac49
          - lane: port-only
            ref: ca659c519de769b6eb42ef62cb0bf088d57f9772
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Bounded source and CLI profile proof
        env:
          PROOF_DIR: ${{ runner.temp }}/zoo-baseline-proof
        run: |
          mkdir -p "$PROOF_DIR"
          python3 - <<'PYPROOF'
          import os,json,pathlib,subprocess,time,hashlib
          out=pathlib.Path(os.environ['PROOF_DIR']);repo=pathlib.Path.cwd()
          os.sched_setaffinity(0,{min(os.sched_getaffinity(0))})
          def call(argv,stem):
              r=subprocess.run(argv,cwd=repo,text=True,capture_output=True,timeout=180)
              (out/(stem+'.stdout.log')).write_text(r.stdout);(out/(stem+'.stderr.log')).write_text(r.stderr)
              return r
          tests=call(['pnpm','exec','vitest','run','tools/zoo-api2.test.ts','tools/zoo-api2-cli.test.mjs'],'targeted')
          proof={'schema':'mandos/zoo-baselines-proof@1','ref':os.environ['GITHUB_SHA'],'testsExit':tests.returncode,'affinity':sorted(os.sched_getaffinity(0))}
          build=call(['node','tools/zoo-build.mjs','--out',str(out/'bundle')],'build')
          proof['buildExit']=build.returncode
          if build.returncode==0:
              (out/'flags.json').write_text(json.dumps({'borg.playsRisky':True,'borg.selfScum':False}))
              common=['node','tools/zoo-run.mjs','--bundle',str(out/'bundle'),'--seed','7','--turns','51','--race','Human','--class','Warrior','--settings',str(out/'flags.json')]
              records=[]
              for name in ['a','b']:
                  r=call(common+['--out',str(out/(name+'.json')),'--states',str(out/(name+'.states.jsonl')),'--commands',str(out/(name+'.commands.jsonl'))],name)
                  proof[name+'Exit']=r.returncode
                  if r.returncode==0:records.append(json.loads((out/(name+'.json')).read_text()))
              if len(records)==2:
                  for r in records:r.pop('metadata',None)
                  assert records[0]==records[1], 'records differ except wall'
                  assert (out/'a.states.jsonl').read_bytes()==(out/'b.states.jsonl').read_bytes(),'state stream differs'
                  assert (out/'a.commands.jsonl').read_bytes()==(out/'b.commands.jsonl').read_bytes(),'command stream differs'
                  assert hashlib.sha256((out/'a.commands.jsonl').read_bytes()).hexdigest()==records[0]['playSha256']
                  r=records[0];assert r['controllerProfile']=='api2-plugin' and r['commandStreamProfile']=='api2-intents-v1'
                  assert r['settings']['borg.playsRisky'] is True and r['settings']['borg.selfScum'] is False
                  assert r['provenance']['lane']['includesCTranslations'] is False
                  proof.update({'repeatRecordExceptWall':True,'repeatStates':True,'repeatCommands':True,'actualOutcome':r['outcome'],'actualTicks':r['turn'],'playSha256':r['playSha256'],'runtime':r['provenance']['runtime'],'lane':r['provenance']['lane'],'bundleSha256':r['provenance']['bundleSha256'],'sourceSha256':r['provenance']['sourceSha256']})
          (out/'proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          assert tests.returncode==0 and build.returncode==0 and proof.get('repeatRecordExceptWall'), 'profile proof failed; raw outputs preserved'
          PYPROOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoo-baseline-${{ matrix.lane }}
          path: ${{ runner.temp }}/zoo-baseline-proof
