# ONE-OFF proof213 branch only. Never merge this workflow into main.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zoo-proof-213-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build once from the measured source
        run: node tools/zoo-build.mjs --out "$RUNNER_TEMP/zoo-bundle"
      - name: Bounded contract and measurement proof on one CPU
        env:
          ZOO_BUNDLE: ${{ runner.temp }}/zoo-bundle
          ZOO_PROOF_OUT: ${{ runner.temp }}/zoo-proof
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/zoo-proof.mjs" <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { availableParallelism } from 'node:os';
          import { performance } from 'node:perf_hooks';
          const out = process.env.ZOO_PROOF_OUT;
          const bundle = process.env.ZOO_BUNDLE;
          mkdirSync(out, { recursive: true });
          const proof = { schema: 'mandos/zoo-proof213@1', candidate: 'de77e7bbf49d683e5226d326257c3013d6936aed',
            runtime: { node: process.version, platform: process.platform, arch: process.arch, availableParallelism: availableParallelism(), affinity: process.env.ZOO_AFFINITY },
            birthPairs: 99, rows: [], speed: [], determinism: null };
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const read = file => JSON.parse(readFileSync(file, 'utf8'));
          const flags = join(out, 'flags.json');
          writeFileSync(flags, JSON.stringify({ 'borg.playsRisky': false, 'borg.selfScum': true }) + '\n');
          function run(name, seed, cls, race, turns, timeout) {
            const record = join(out, `${name}.json`), states = join(out, `${name}.states.jsonl`), commands = join(out, `${name}.commands.jsonl`);
            const args = ['tools/zoo-run.mjs', '--bundle', bundle, '--seed', String(seed), '--turns', String(turns), '--race', race, '--class', cls,
              '--settings', flags, '--out', record, '--states', states, '--commands', commands];
            const start = performance.now();
            const result = spawnSync(process.execPath, args, { encoding: 'utf8', timeout, maxBuffer: 16 * 1024 * 1024 });
            writeFileSync(join(out, `${name}.stdout.log`), result.stdout ?? '');
            writeFileSync(join(out, `${name}.stderr.log`), result.stderr ?? '');
            if (result.status !== 0) {
              const failure = { name, seed, class: cls, race, requestedTurns: turns, outcome: 'harness_failure',
                error: result.error?.message ?? result.stderr ?? `status ${result.status}`, status: result.status, signal: result.signal,
                wallTimeMs: performance.now() - start };
              writeFileSync(join(out, `${name}.proof-failure.json`), JSON.stringify(failure, null, 2) + '\n');
              return failure;
            }
            const value = read(record);
            const commandBytes = readFileSync(commands);
            if (hash(commandBytes) !== value.playSha256) throw new Error(`Command file/hash mismatch ${name}`);
            const lines = readFileSync(states, 'utf8').trim().split('\n').map(JSON.parse);
            if (lines[0].kind !== 'birth' || lines.at(-1).kind !== 'stop') throw new Error(`Missing terminal states ${name}`);
            const row = { name, seed, class: cls, race, requestedTurns: turns, actualTurns: value.turn, outcome: value.outcome,
              causeOfDeath: value.causeOfDeath, maxDepth: value.maxDepth, level: value.level, maxLevel: value.maxLevel,
              decisions: value.decisions, loopCalls: value.loopCalls, wallTimeMs: value.metadata.wallTimeMs,
              processWallTimeMs: performance.now() - start, playSha256: value.playSha256, stateLines: lines.length,
              periodicStates: lines.filter(line => line.kind === 'periodic').length };
            console.log(JSON.stringify(row));
            return row;
          }
          try {
            if (availableParallelism() !== 1) throw new Error('Proof process is not restricted to one CPU');
            const tests = execFileSync('pnpm', ['exec', 'vitest', 'run', 'src/zoo-session.test.ts'], { encoding: 'utf8', timeout: 180000 });
            writeFileSync(join(out, 'targeted-tests.log'), tests);
            const seeds = [1, 7, 42], classes = ['Warrior', 'Mage', 'Rogue'], races = ['Human', 'Elf', 'Dwarf'];
            for (let s = 0; s < seeds.length; s++) for (let c = 0; c < classes.length; c++) {
              const row = run(`cohort-${seeds[s]}-${classes[c]}`, seeds[s], classes[c], races[(s + c) % races.length], 20000, 180000);
              proof.rows.push(row);
              if (row.outcome === 'harness_failure') throw new Error(`Mandatory cohort entry failed: ${row.name}`);
            }
            const originalName = 'cohort-7-Warrior';
            const repeated = run('repeat-7-Warrior', 7, 'Warrior', 'Elf', 20000, 180000);
            if (repeated.outcome === 'harness_failure') throw new Error('Repeated measurement failed');
            const a = read(join(out, `${originalName}.json`)), b = read(join(out, 'repeat-7-Warrior.json'));
            delete a.metadata.wallTimeMs; delete b.metadata.wallTimeMs;
            if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error('Same inputs differ after excluding wall time');
            for (const stream of ['states', 'commands']) if (hash(readFileSync(join(out, `${originalName}.${stream}.jsonl`))) !== hash(readFileSync(join(out, `repeat-7-Warrior.${stream}.jsonl`)))) throw new Error(`Repeated ${stream} differ`);
            proof.determinism = { identicalRecordExceptWall: true, identicalStates: true, identicalCommands: true, normalizedRecordSha256: hash(JSON.stringify(a)) };
            proof.speed.push(run('speed-100k', 7, 'Warrior', 'Human', 100000, 300000));
            if (proof.speed[0].outcome === 'harness_failure') throw new Error('100k cap measurement failed');
            proof.speed.push(run('speed-400k', 7, 'Warrior', 'Human', 400000, 300000));
            proof.optional400kCompleted = proof.speed[1].outcome !== 'harness_failure';
            if (!proof.rows.some(row => row.periodicStates > 0)) throw new Error('No periodic states observed in cohort');
            proof.complete = true;
          } catch (error) {
            proof.complete = false; proof.error = error.stack ?? String(error); process.exitCode = 1;
          } finally { writeFileSync(join(out, 'proof.json'), JSON.stringify(proof, null, 2) + '\n'); }
          NODE
          python3 -c 'import os,sys; cpu=min(os.sched_getaffinity(0)); os.sched_setaffinity(0,{cpu}); os.environ["ZOO_AFFINITY"]=str(cpu); os.execvp("node",["node",sys.argv[1]])' "$RUNNER_TEMP/zoo-proof.mjs"
      - name: Retain every attempt and stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mandos-zoo-proof213
          path: ${{ runner.temp }}/zoo-proof
          if-no-files-found: error
