# ONE-OFF final interface proof for213, outside the main PR.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: zoo-final-213-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the preserved original streams
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42492138401 -R "$GITHUB_REPOSITORY" --name mandos-zoo-proof213 --dir "$RUNNER_TEMP/old-proof"
      - run: node tools/zoo-build.mjs --out "$RUNNER_TEMP/zoo-bundle"
      - name: Final CLI and repeated original case on one CPU
        env:
          ZOO_BUNDLE: ${{ runner.temp }}/zoo-bundle
          ZOO_PROOF_OUT: ${{ runner.temp }}/zoo-final
          ZOO_OLD: ${{ runner.temp }}/old-proof
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/zoo-final.mjs" <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { availableParallelism } from 'node:os';
          const out = process.env.ZOO_PROOF_OUT, bundle = process.env.ZOO_BUNDLE;
          mkdirSync(out, { recursive: true });
          const proof = { schema: 'mandos/zoo-final213@1', candidate: 'd916cf8e9a0eaf49907da5d01be22654a85b41bb',
            runtime: { node: process.version, platform: process.platform, availableParallelism: availableParallelism(), affinity: process.env.ZOO_AFFINITY } };
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const read = file => JSON.parse(readFileSync(file));
          try {
            if (availableParallelism() !== 1) throw new Error('Expected one CPU');
            const tests = spawnSync('pnpm', ['exec', 'vitest', 'run', 'tools/zoo-cli.test.mjs'], { encoding: 'utf8', timeout: 120000 });
            writeFileSync(join(out, 'cli-tests.log'), (tests.stdout ?? '') + (tests.stderr ?? ''));
            if (tests.status !== 0) throw new Error('Final CLI controls failed');
            proof.cliControls = 12;
            const flags = join(out, 'flags.json'); writeFileSync(flags, '{"borg.playsRisky":false,"borg.selfScum":true}\n');
            for (const name of ['first', 'second']) {
              const result = spawnSync(process.execPath, ['tools/zoo-run.mjs', '--bundle', bundle, '--seed', '7', '--race', 'Elf', '--class', 'Warrior', '--turns', '20000', '--settings', flags,
                '--out', join(out, `${name}.json`), '--states', join(out, `${name}.states.jsonl`), '--commands', join(out, `${name}.commands.jsonl`)], { encoding: 'utf8', timeout: 60000 });
              writeFileSync(join(out, `${name}.stdout.log`), result.stdout ?? ''); writeFileSync(join(out, `${name}.stderr.log`), result.stderr ?? '');
              if (result.status !== 0) throw new Error(`Repeated run ${name} failed`);
            }
            const a = read(join(out, 'first.json')), b = read(join(out, 'second.json'));
            delete a.metadata.wallTimeMs; delete b.metadata.wallTimeMs;
            if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error('Records differ apart from wall metadata');
            proof.recordSameExceptWall = true;
            for (const stream of ['states', 'commands']) {
              const first = readFileSync(join(out, `first.${stream}.jsonl`));
              if (!first.equals(readFileSync(join(out, `second.${stream}.jsonl`)))) throw new Error(`Repeat ${stream} differ`);
              if (!first.equals(readFileSync(join(process.env.ZOO_OLD, `cohort-7-Warrior.${stream}.jsonl`)))) throw new Error(`Original/final ${stream} differ`);
              proof[`${stream}MatchOriginalAndRepeat`] = true;
            }
            if (hash(readFileSync(join(out, 'first.commands.jsonl'))) !== a.playSha256) throw new Error('Command/hash mismatch');
            if (a.provenance.bundleSha256 !== '0f8fd1db14e9500a93cc49ac6db38e8e19a58a57ff5669907cccbdc5a29a4871') throw new Error('Game bundle changed');
            proof.bundleSha256 = a.provenance.bundleSha256;
            proof.sourceSha256 = a.provenance.sourceSha256;
            proof.playSha256 = a.playSha256;
            proof.outcome = a.outcome; proof.actualTurns = a.turn; proof.maxDepth = a.maxDepth; proof.level = a.level;
            proof.complete = true;
          } catch (error) { proof.complete = false; proof.error = error.stack ?? String(error); process.exitCode = 1; }
          finally { writeFileSync(join(out, 'proof.json'), JSON.stringify(proof, null, 2) + '\n'); }
          NODE
          python3 -c 'import os,sys; cpu=min(os.sched_getaffinity(0)); os.sched_setaffinity(0,{cpu}); os.environ["ZOO_AFFINITY"]=str(cpu); os.execvp("node",["node",sys.argv[1]])' "$RUNNER_TEMP/zoo-final.mjs"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mandos-zoo-final213
          path: ${{ runner.temp }}/zoo-final
          if-no-files-found: error
