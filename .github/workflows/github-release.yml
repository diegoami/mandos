# FORK: tag mirroring must not publish inherited releases. Kept disabled at
# repository level; any future release requires an explicit owner-directed run.
name: GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified version tag
        required: true
        type: string
      title:
        description: Explicit release title naming the upstream or port-only lane
        required: true
        type: string
      notes:
        description: Reviewed release notes with provenance and verification links
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'diegoami/mandos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate existing tag and explicit release notes
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          git check-ref-format "refs/tags/$TAG"
          git rev-parse --verify "refs/tags/$TAG^{commit}"
          test -n "$RELEASE_NOTES"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
      - name: Create explicitly requested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease --verify-tag
